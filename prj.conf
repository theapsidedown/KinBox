CONFIG_LOG=y
CONFIG_PRINTK=y

# ---- kept from the original project (WS2812 + flash size) ----
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESPTOOLPY_HEADER_FLASHSIZE_UPDATE=y

# ---- randomness (hatching, battle seeds). The weak TEST generator is gone. ----
CONFIG_ENTROPY_GENERATOR=y

# ---- buttons (gpio-keys -> input subsystem) ----
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# ---- display: 1.8" ST7735 over SPI + LVGL ----
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y

# ---- storage: NVS on the storage partition ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_REBOOT=y

# ---- BLE: advertise + scan at once, one connection ----
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="KinBox"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BUF_ACL_TX_COUNT=12

# ---- stacks ----
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=29696
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
